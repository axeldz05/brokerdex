<div class="progress-bar-custom">
    <div
        class="progress-fill"
        role="progressbar"
        aria-label="{{ incubation.egg_template.name }} incubation progress"
        aria-valuenow="{{ progress }}"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuetext="{{ progress }} percent complete"
        style="width: {{ progress }}%;"
    ></div>
</div>
