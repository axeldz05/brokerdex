{% extends "layout.html" %}

{% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <!-- Balance Display -->
            <div class="card mb-4">
                <div class="card-body text-center">
                    <h5 class="card-title">Current Balance</h5>
                    <h2 class="text-primary">${{ user_balance|floatformat:2 }}</h2>
                </div>
            </div>
            <!-- Transfer Form -->
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">Transfer Funds</h4>
                </div>
                <div class="card-body">
                    <form method="POST" id="amount-form">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="receiver_username" class="form-label">Recipient Username</label>
                            <input type="text" 
                                   class="form-control" 
                                   id="receiver_username"
                                   name="receiver_username"
                                   value="{{ form.receiver_username.value|default:'' }}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="amount" class="form-label">Amount</label>
                            <input type="number" 
                                   class="form-control" 
                                   id="amount"
                                   name="amount"
                                   value="{{ form.amount.value|default:'' }}"
                                   step="0.01"
                                   min="0.01"
                                   max="{{ user_balance }}"
                                   required>
                        </div>

                        <button type="submit" class="btn btn-success">Transfer Funds</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center mt-3">
        <a href="{% url 'dashboard:dashboard' %}" class="text-decoration-none text-muted">← Back to Dashboard</a>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.getElementById('amount-form')?.addEventListener('submit', function(e) {
        const amountInput = document.getElementById('amount');
        const maxAmount = parseFloat(amountInput.getAttribute('max'));
        const enteredAmount = parseFloat(amountInput.value);
        
        if (enteredAmount > maxAmount) {
            e.preventDefault();
            alert('Transfer amount cannot exceed your current balance.');
        }
    });
</script>
{% endblock %}
